<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440"
     role="img" aria-labelledby="cycleTitle cycleDesc" font-family="system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif">
  <title id="cycleTitle">How a change becomes a release</title>
  <desc id="cycleDesc">A change is verified on Linux and Windows, built reproducibly for three
  targets, held at a human approval gate before anything is signed, signed with Authenticode and
  cosign with provenance attested, then published and rebuilt from its own tag to prove the bytes
  match. What breaks in the field becomes the next change.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9eff"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#949bab"/>
    </marker>
    <style>
      .n    { fill:#1c1f25; stroke:#2c313a; stroke-width:1.5; }
      .gate { fill:#221d12; stroke:#f0b429; stroke-width:1.75; }
      .t    { fill:#e6e8ec; font-size:16px; font-weight:600; }
      .s    { fill:#949bab; font-size:12.5px; }
      .k    { fill:#6f7788; font-size:11px; letter-spacing:.08em; }
      .flow { stroke:#4a9eff; stroke-width:2; fill:none; }
      .back { stroke:#949bab; stroke-width:1.75; fill:none; stroke-dasharray:6 5; }
      .g    { fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="440" rx="14" fill="#14161a" stroke="#2c313a"/>

  <text x="40" y="44" class="t" font-size="19">How a change becomes a release</text>
  <text x="40" y="68" class="s">Nothing is signed without a person saying so, and every release is rebuilt from its own tag to prove the bytes match.</text>

  <!-- ── 1. change ─────────────────────────────────────────────── -->
  <g transform="translate(40,104)">
    <rect class="n" width="170" height="132" rx="10"/>
    <g class="g" stroke="#4a9eff" transform="translate(18,20)">
      <path d="M2 14 L11 5 L15 9 L6 18 L1 19 Z"/>
      <path d="M0 24 H18"/>
    </g>
    <text x="18" y="86" class="t">Change</text>
    <text x="18" y="108" class="s">A fix, or something</text>
    <text x="18" y="124" class="s">an operator hit.</text>
  </g>

  <!-- ── 2. verify ─────────────────────────────────────────────── -->
  <g transform="translate(246,104)">
    <rect class="n" width="170" height="132" rx="10"/>
    <g class="g" stroke="#3ddc84" transform="translate(18,20)">
      <circle cx="11" cy="11" r="10"/>
      <path d="M6 11 L10 15 L17 7"/>
    </g>
    <text x="18" y="86" class="t">Verify</text>
    <text x="18" y="108" class="s">Vet and tests, twice</text>
    <text x="18" y="124" class="s">over, on both systems.</text>
  </g>

  <!-- ── 3. build ──────────────────────────────────────────────── -->
  <g transform="translate(452,104)">
    <rect class="n" width="170" height="132" rx="10"/>
    <g class="g" stroke="#4a9eff" transform="translate(18,20)">
      <path d="M11 1 L21 6 V17 L11 22 L1 17 V6 Z"/>
      <path d="M1 6 L11 11 L21 6 M11 11 V22"/>
    </g>
    <text x="18" y="86" class="t">Build</text>
    <text x="18" y="108" class="s">Three targets, and</text>
    <text x="18" y="124" class="s">reproducibly.</text>
  </g>

  <!-- ── 4. the gate ───────────────────────────────────────────── -->
  <g transform="translate(658,104)">
    <rect class="gate" width="170" height="132" rx="10"/>
    <g class="g" stroke="#f0b429" transform="translate(18,20)">
      <circle cx="7" cy="8" r="5"/>
      <path d="M12 8 H22 M18 8 V13 M21 8 V12"/>
    </g>
    <text x="18" y="86" class="t">Approve</text>
    <text x="18" y="108" class="s">It stops here. Nothing</text>
    <text x="18" y="124" class="s">has touched the key.</text>
    <text x="18" y="-8" class="k" fill="#f0b429">A HUMAN, EVERY TIME</text>
  </g>

  <!-- ── 5. sign ───────────────────────────────────────────────── -->
  <g transform="translate(864,104)">
    <rect class="n" width="170" height="132" rx="10"/>
    <g class="g" stroke="#4a9eff" transform="translate(18,20)">
      <path d="M11 1 L20 5 V11 C20 17 16 21 11 23 C6 21 2 17 2 11 V5 Z"/>
      <path d="M7 11 L10 14 L15 8"/>
    </g>
    <text x="18" y="86" class="t">Sign</text>
    <text x="18" y="108" class="s">Authenticode, cosign,</text>
    <text x="18" y="124" class="s">provenance attested.</text>
  </g>

  <!-- ── 6. publish ────────────────────────────────────────────── -->
  <g transform="translate(1070,104)">
    <rect class="n" width="170" height="132" rx="10"/>
    <g class="g" stroke="#3ddc84" transform="translate(18,20)">
      <path d="M11 22 V4"/>
      <path d="M4 11 L11 4 L18 11"/>
      <path d="M1 22 H21"/>
    </g>
    <text x="18" y="86" class="t">Publish</text>
    <text x="18" y="108" class="s">Then rebuilt from the</text>
    <text x="18" y="124" class="s">tag, byte for byte.</text>
  </g>

  <!-- flow arrows -->
  <g class="flow" marker-end="url(#arrow)">
    <path d="M216 170 H240"/>
    <path d="M422 170 H446"/>
    <path d="M628 170 H652"/>
    <path d="M834 170 H858"/>
    <path d="M1040 170 H1064"/>
  </g>

  <!-- the loop back: the field is the last test -->
  <path class="back" marker-end="url(#arrowBack)"
        d="M1155 248 V300 Q1155 316 1139 316 H141 Q125 316 125 300 V252"/>
  <text x="640" y="342" class="s" text-anchor="middle">
    What breaks on somebody's site becomes the next change. Most of these releases began as a report, not a plan.
  </text>

  <!-- what the chain actually guarantees -->
  <g transform="translate(40,372)">
    <rect width="1200" height="44" rx="9" fill="#181b21" stroke="#2c313a"/>
    <text x="18" y="27" class="s">
      <tspan fill="#3ddc84">&#10003;</tspan><tspan> Rebuilt from its tag, byte-identical</tspan>
      <tspan fill="#3a3f4a">&#160;&#160;&#124;&#160;&#160;</tspan>
      <tspan fill="#3ddc84">&#10003;</tspan><tspan> Signatures checked before publishing, not after</tspan>
      <tspan fill="#3a3f4a">&#160;&#160;&#124;&#160;&#160;</tspan>
      <tspan fill="#3ddc84">&#10003;</tspan><tspan> An update refuses a binary whose version disagrees with its tag</tspan>
      <tspan fill="#3a3f4a">&#160;&#160;&#124;&#160;&#160;</tspan>
      <tspan fill="#3ddc84">&#10003;</tspan><tspan> Publisher pinned to the one already running</tspan>
    </text>
  </g>
</svg>
