name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not a convenience. It produces static binaries that run anywhere including
  # Alpine and containers, keeps builds reproducible enough that a reader can
  # verify a release matches its tag, and disqualifies the cgo-linked
  # dependencies this project deliberately does not use (docs/DESIGN-RULES.md §7).
  CGO_ENABLED: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # BOTH platforms, always. The secret store has a completely different
        # implementation per OS -- DPAPI on Windows, the systemd-creds/TPM/key-file
        # chain on Linux -- and cross-compiling only proves they COMPILE. The
        # Linux tiers are exercised for real here and nowhere else.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -count=2 because a test that passes once and fails the second time is a
      # test with hidden state, and this codebase has timing-sensitive pacer and
      # scheduler tests where that matters.
      - name: go test
        run: go test -count=2 ./...

      - name: go mod tidy is clean
        shell: bash
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod/go.sum; commit the result"
            git diff go.mod go.sum
            exit 1
          fi

      # Two files name the toolchain: .go-version (what CI installs) and
      # go.mod's `toolchain` line (what a developer's go command fetches
      # automatically). They must agree, or a release is built with one version
      # and reproduced by a verifier with another -- which looks exactly like a
      # tampered binary.
      - name: the two toolchain pins agree
        shell: bash
        run: |
          pinned=$(tr -d '[:space:]' < .go-version)
          declared=$(awk '/^toolchain /{print $2}' go.mod | sed 's/^go//')
          echo ".go-version=$pinned  go.mod toolchain=$declared"
          if [ "$pinned" != "$declared" ]; then
            echo "::error::.go-version ($pinned) and go.mod toolchain ($declared) disagree"
            exit 1
          fi

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      # The one place cgo is deliberately enabled. -race requires it, and the
      # concurrency here is load-bearing: a shared per-console pacer, a bounded
      # per-channel delivery queue, and a store that ingest, the scheduler and
      # the UI all touch at once. This job builds nothing that ships.
      - name: go test -race
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - name: scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
