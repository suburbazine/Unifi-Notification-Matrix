name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  CGO_ENABLED: 0

jobs:
  # THE CHANGELOG IS A RELEASE GATE, and it runs before anything is built.
  #
  # A release whose notes say only how to VERIFY the binary tells a downloader
  # nothing about what they are installing, which is the state every release
  # here was in until 0.1.8. Generated notes do not fix it: commit subjects are
  # written for the repository, not for somebody arriving at a download page.
  #
  # Failing here rather than at publish time is the point. The alternative is
  # discovering the omission after a human has already approved the signing
  # certificate, at which point the cheap fix -- add a section, retag -- costs
  # a second approval and leaves a dead tag behind.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    outputs:
      section: ${{ steps.extract.outputs.section }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: extract this version's section
        id: extract
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          section=$(scripts/changelog-section.sh "$REF")
          echo "$section"
          {
            echo "section<<CHANGELOG_EOF"
            echo "$section"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # Gate the release on the same checks CI runs. A signed broken binary is
  # worse than an unsigned one, because the signature is what persuades
  # somebody to run it.
  verify:
    name: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - run: go vet ./...
      - run: go test -count=2 ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [changelog, verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      # `github.ref_name` alone is wrong for `workflow_dispatch`: the run's ref
      # is the DEFAULT BRANCH, not the tag being built, so a dispatched release
      # shipped binaries reporting `version main`. The checkout above already
      # prefers `inputs.tag`; this has to agree with it, or the source and the
      # version baked into it come from different places.
      - name: resolve version
        id: v
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${REF#v}"
          case "$version" in
            [0-9]*) ;;
            *) echo "refusing to build: version '$version' is not a version number" >&2; exit 1;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      # Reproducibility is the point, not a bonus. For a source-available
      # security tool, source nobody can check against the published binary
      # buys very little -- so:
      #   -trimpath      removes absolute build paths
      #   -buildid=      removes the only remaining nondeterministic field
      #   pinned Go      via .go-version, because the toolchain is an input
      #   CGO_ENABLED=0  no host libc leaking in
      # Given the same tag and the same Go version, anyone can rebuild this
      # byte for byte and compare hashes. docs/RELEASING.md says how.
      #
      # The output goes to dist/, which is in .gitignore, and that is
      # load-bearing rather than tidiness: Go stamps `vcs.modified` into the
      # binary, an untracked file in the checkout sets it, and the build would
      # still succeed while producing bytes nobody can reproduce. Do not move
      # this output anywhere git can see it.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="notifymatrix-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=${{ steps.v.outputs.version }}" \
            -o "dist/${out}" ./cmd/notifymatrix
          sha256sum "dist/${out}"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Windows Authenticode, via Azure Artifact Signing (formerly Trusted
  # Signing). Authenticated with FEDERATED CREDENTIALS over OIDC -- there is no
  # long-lived Azure secret in this repository. See docs/RELEASING.md for the
  # one-time Azure-side setup.
  sign-windows:
    name: sign windows (Authenticode)
    needs: build
    runs-on: windows-latest
    # The federated credential's subject is pinned to this environment, NOT to a
    # tag: Entra ID federated credentials do not accept wildcards in the
    # subject, so a tag-based subject would need a new credential for every
    # release. An environment gives one stable subject.
    #
    # It also carries REQUIRED REVIEWERS, so this job parks at `waiting` until
    # a human approves it, and the run does not reach the certificate before
    # then. Pushing a tag is deliberately not sufficient, on its own, to sign
    # something as a real legal entity. See docs/RELEASING.md section 3.
    environment: release
    permissions:
      id-token: write # the OIDC token azure/login exchanges
      contents: read
    steps:
      # BEFORE the artefact is downloaded, deliberately.
      #
      # actions/checkout clears its destination when that destination is not
      # already a git repository, and `clean: false` does not stop it -- that
      # flag only governs `git clean` inside an EXISTING checkout. Running it
      # after the download deleted dist/ between signing the binary and
      # uploading it, which is how the first attempt at this lost a
      # successfully signed artefact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: bin-windows-amd64
          path: dist

      - name: azure login (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: sign
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Timestamping is what makes the signature outlive the certificate. An
      # untimestamped binary starts failing validation the day the cert
      # expires, on machines that were happily running it yesterday.
      - name: verify the signature and its timestamp
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\notifymatrix-windows-amd64.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "Authenticode status is $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw "signature is not timestamped" }

      # The in-app updater refuses any replacement whose Authenticode signature
      # does not verify and whose signer is not the publisher of the binary
      # already installed. Those tests skip without a genuinely signed file, so
      # everywhere else they are decoration -- this is the one job that has one.
      #
      # It runs against THIS release's artefact, which means the check that
      # guards self-update is exercised on the exact bytes being shipped. A
      # verifier that had quietly stopped working would otherwise be discovered
      # by an operator, on the day it let something through.
      - name: exercise the update verifier against the signed artefact
        env:
          NOTIFYMATRIX_SIGNED_FIXTURE: ${{ github.workspace }}\dist\notifymatrix-windows-amd64.exe
        run: go test ./internal/update/ -run 'Signed|Tampered|Unsigned' -v

      - uses: actions/upload-artifact@v7
        with:
          name: signed-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: sign, attest and publish
    needs: [changelog, build, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless + provenance attestation
      attestations: write
    env:
      # The `secrets` context is NOT available in a step-level `if`, but it IS
      # available in job-level `env`. Hoisting it here is what makes the
      # optional GPG step actually skippable rather than silently always-on.
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: staging

      - name: assemble dist
        run: |
          mkdir -p dist
          # The SIGNED Windows binary, not the unsigned one from build.
          cp staging/signed-windows-amd64/* dist/
          cp staging/bin-linux-amd64/* dist/
          cp staging/bin-linux-arm64/* dist/
          ls -l dist

      - name: checksums
        run: |
          cd dist
          sha256sum notifymatrix-* > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance: a signed statement of which source commit, which
      # workflow and which runner produced these exact bytes. Verified with
      # `gh attestation verify`.
      #
      # Deliberately BEFORE the cosign step, so `dist/notifymatrix-*` is
      # exactly the three binaries. Run after it and the glob also sweeps up
      # the signature bundles, which are not build outputs and have no
      # provenance to attest.
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/notifymatrix-*

      - uses: sigstore/cosign-installer@v4.1.2

      # Keyless: the signing identity is this workflow, proven by the OIDC
      # token, and the certificate is logged to the public Rekor transparency
      # log. Nothing to rotate, nothing to leak, and a verifier can check WHICH
      # workflow in WHICH repository produced the binary -- which a bare
      # detached signature cannot tell them.
      #
      # One `.sigstore.json` bundle per artefact, rather than the older
      # `.sig` + `.pem` pair. cosign 3 removed the split-file flags; the bundle
      # is also one fewer file for a verifier to fetch and pass correctly.
      - name: cosign sign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          for f in notifymatrix-* SHA256SUMS; do
            cosign sign-blob "$f" --bundle "${f}.sigstore.json"
          done
          ls -l

      # Run the exact command the release notes tell people to run. The
      # verification recipe is the part of a release that is never exercised
      # until somebody outside the project tries it -- by which point a wrong
      # flag reads as "this binary is not what it claims to be".
      #
      # The identity regexp is the load-bearing half. Without it cosign
      # verifies a signature from anyone, so a verification step that omitted
      # it would pass no matter who signed.
      - name: verify what we just signed
        run: |
          cd dist
          for f in notifymatrix-* SHA256SUMS; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign verify-blob "$f" \
              --bundle "${f}.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      # Optional, and deliberately so. GPG needs a long-lived private key in
      # repository secrets, which is a weaker posture than the keyless path
      # above -- it exists only because distro packagers and long-time Linux
      # users still expect a detached .asc. If no key is configured the release
      # still ships, fully signed by cosign.
      - name: gpg sign (optional)
        if: env.HAS_GPG == 'yes'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          for f in notifymatrix-* SHA256SUMS; do
            case "$f" in *.sigstore.json) continue;; esac
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign --output "${f}.asc" "$f"
          done

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/notifymatrix-*
            dist/SHA256SUMS*
          body: |
            ## What changed

            ${{ needs.changelog.outputs.section }}

            ## Verifying this release

            Every binary is signed. Verification instructions, including how to
            rebuild from source and compare hashes, are in
            [docs/RELEASING.md](docs/RELEASING.md).

            **Linux / macOS — cosign (keyless, no key to trust in advance):**

            ```
            cosign verify-blob notifymatrix-linux-amd64 \
              --bundle notifymatrix-linux-amd64.sigstore.json \
              --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Download the `.sigstore.json` next to the binary; it carries the
            signature, the certificate and the transparency-log proof. Keep
            `--certificate-identity-regexp` — without it cosign verifies a
            signature from *anyone*.

            **Build provenance (any platform):**

            ```
            gh attestation verify notifymatrix-linux-amd64 --repo ${{ github.repository }}
            ```

            **Windows:** the `.exe` is Authenticode-signed and timestamped.
            Right-click → Properties → Digital Signatures, or:

            ```
            Get-AuthenticodeSignature .\notifymatrix-windows-amd64.exe
            ```

